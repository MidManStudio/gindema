# .github/workflows/mirage-train-bench.yml
name: mirage-train bench

on:
  workflow_dispatch:
    inputs:
      run_training:
        description: 'Also run real train/eval passes (downloads ~600 MB of CLIP weights and ~780 MB of COCO val2017; takes a while)'
        type: boolean
        default: false
      images:
        description: 'How many COCO val2017 photos to use (first N by file name, at least 30)'
        type: string
        default: '150'
      holdout:
        description: 'How many of them to keep out of training for evaluation'
        type: string
        default: '40'
      steps:
        description: 'Training steps per run'
        type: string
        default: '300'
      batch_size:
        description: 'Images per training step'
        type: string
        default: '8'

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-gindema-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gindema-

      - name: Toolchain info
        run: |
          mkdir -p ci-logs
          { rustc --version; cargo --version; } | tee ci-logs/toolchain.txt

      - name: cargo build (release)
        id: build
        run: |
          set -o pipefail
          s=$(date +%s); rc=0
          cargo build -p mirage-train --release 2>&1 | tee ci-logs/build.log || rc=$?
          echo $(( $(date +%s) - s )) > ci-logs/build.secs
          exit $rc

      # test and clippy still run if the build failed, so one run reports everything.
      - name: cargo test
        id: test
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          s=$(date +%s); rc=0
          cargo test -p mirage-core -p mirage-train 2>&1 | tee ci-logs/test.log || rc=$?
          echo $(( $(date +%s) - s )) > ci-logs/test.secs
          exit $rc

      - name: cargo clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          s=$(date +%s); rc=0
          cargo clippy -p mirage-core -p mirage-train --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log || rc=$?
          echo $(( $(date +%s) - s )) > ci-logs/clippy.secs
          exit $rc

      - name: Job summary
        if: ${{ always() }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ passed" ;;
              failure) echo "❌ failed" ;;
              skipped) echo "⏭️ skipped" ;;
              *) echo "$1" ;;
            esac
          }

          secs() {
            if [ -f "ci-logs/$1.secs" ]; then echo "$(cat "ci-logs/$1.secs")s"; else echo "n/a"; fi
          }

          show_errors() {
            name="$1"; outcome="$2"; file="$3"
            [ "$outcome" = "failure" ] || return 0
            {
              echo
              echo "<details open><summary>${name}: first errors</summary>"
              echo
              echo '```'
              grep -m 10 -A 8 -E '^error|^failures:|FAILED$' "$file" 2>/dev/null | head -n 120 || true
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          counts=$(awk '/^test result:/ { for (i = 1; i <= NF; i++) { if ($i == "passed;") p += $(i-1); if ($i == "failed;") f += $(i-1); if ($i == "ignored;") g += $(i-1) } } END { print p+0, f+0, g+0 }' ci-logs/test.log 2>/dev/null || true)
          set -- ${counts:-0 0 0}
          passed=$1; failed=$2; ignored=$3
          toolchain=$(head -n 1 ci-logs/toolchain.txt 2>/dev/null || echo unknown)

          bin=target/release/mirage-train
          if [ -f "$bin" ]; then
            bytes=$(stat -c %s "$bin")
            size="$(numfmt --to=iec "$bytes" 2>/dev/null || echo "${bytes} B") (${bytes} bytes)"
          else
            bytes=0
            size="n/a"
          fi

          {
            echo "## mirage-train bench summary"
            echo
            echo "- **Toolchain:** \`${toolchain}\`"
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            echo "- **Release binary size:** ${size}"
            echo
            echo "| Step | Result | Time |"
            echo "|---|---|---|"
            echo "| cargo build --release (mirage-train) | $(icon '${{ steps.build.outcome }}') | $(secs build) |"
            echo "| cargo test (mirage-core + mirage-train) | $(icon '${{ steps.test.outcome }}') | $(secs test) |"
            echo "| ↳ tests | ${passed} passed, ${failed} failed, ${ignored} ignored | |"
            echo "| cargo clippy -D warnings | $(icon '${{ steps.clippy.outcome }}') | $(secs clippy) |"
          } >> "$GITHUB_STEP_SUMMARY"

          show_errors "cargo build" "${{ steps.build.outcome }}" ci-logs/build.log
          show_errors "cargo test" "${{ steps.test.outcome }}" ci-logs/test.log
          show_errors "cargo clippy" "${{ steps.clippy.outcome }}" ci-logs/clippy.log

          printf '{"toolchain":"%s","commit":"%s","build":"%s","build_secs":"%s","test":"%s","clippy":"%s","tests_passed":%s,"tests_failed":%s,"tests_ignored":%s,"binary_bytes":%s}\n' \
            "$toolchain" "${GITHUB_SHA::7}" \
            "${{ steps.build.outcome }}" "$(cat ci-logs/build.secs 2>/dev/null || echo n/a)" \
            "${{ steps.test.outcome }}" "${{ steps.clippy.outcome }}" \
            "$passed" "$failed" "$ignored" "$bytes" > ci-logs/summary.json

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mirage-train-bench-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Opt-in (run_training = true). Measures what the unit tests cannot: does a
  # trained pattern move the real CLIP embedding of images it never saw, in the
  # deployed pipeline (pattern on the full frame, then JPEG), better than a
  # random pattern of the same budget? Two runs on the same data and seed
  # compare the old assumption (pattern covers exactly the crop) with
  # aspect-aware windows plus jitter.
  train-smoke:
    if: ${{ inputs.run_training }}
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGES: ${{ inputs.images }}
      HOLDOUT: ${{ inputs.holdout }}
      STEPS: ${{ inputs.steps }}
      BATCH_SIZE: ${{ inputs.batch_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-gindema-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gindema-

      - name: Check inputs
        run: |
          for v in IMAGES HOLDOUT STEPS BATCH_SIZE; do
            case "${!v}" in ''|*[!0-9]*) echo "$v must be a whole number, got '${!v}'"; exit 1 ;; esac
          done
          [ "$IMAGES" -ge 30 ] || { echo "images must be at least 30"; exit 1; }
          [ "$IMAGES" -le 5000 ] || { echo "images must be at most 5000 (the size of val2017)"; exit 1; }
          [ "$HOLDOUT" -lt "$IMAGES" ] || { echo "holdout must be smaller than images"; exit 1; }
          [ $(( IMAGES - HOLDOUT )) -ge 8 ] || { echo "need at least 8 training images"; exit 1; }
          [ "$STEPS" -ge 1 ] && [ "$BATCH_SIZE" -ge 1 ] || { echo "steps and batch_size must be at least 1"; exit 1; }

      - name: Fetch CLIP weights and sample images
        run: |
          set -euo pipefail
          mkdir -p data/images ci-logs
          # Same repo and revision candle's own CLIP example loads.
          curl -fL --retry 3 --retry-delay 5 -o data/model.safetensors \
            "https://huggingface.co/openai/clip-vit-base-patch32/resolve/refs%2Fpr%2F15/model.safetensors"
          # COCO val2017: take the first N photos by file name (ids are unrelated to content).
          curl -fL --retry 3 --retry-delay 5 -o data/val2017.zip \
            "http://images.cocodataset.org/zips/val2017.zip"
          unzip -Z1 data/val2017.zip | grep -E '^val2017/[0-9]+\.jpg$' | sort | head -n "$IMAGES" > data/selected.txt
          count=$(wc -l < data/selected.txt)
          echo "selected ${count} images"
          [ "$count" -eq "$IMAGES" ] || { echo "val2017.zip had fewer than ${IMAGES} jpgs"; exit 1; }
          xargs -a data/selected.txt unzip -q -j data/val2017.zip -d data/images
          rm data/val2017.zip
          ls data/images | wc -l
          ls -l data/model.safetensors

      - name: Build release binary
        run: cargo build -p mirage-train --release

      - name: Train A (legacy window)
        id: legacy
        run: |
          set -o pipefail
          mkdir -p ci-logs/legacy
          s=$(date +%s); rc=0
          # stdout (the evaluation JSON) goes to a file; stderr (progress) is shown and logged.
          ./target/release/mirage-train train \
            --weights data/model.safetensors --images data/images \
            --out ci-logs/legacy/pattern.mirp --preview ci-logs/legacy/preview.png \
            --summary-md ci-logs/legacy/summary.md \
            --holdout "$HOLDOUT" --steps "$STEPS" --batch-size "$BATCH_SIZE" \
            --legacy-full-window --jitter 0 \
            2>&1 >ci-logs/legacy/eval.json | tee ci-logs/legacy/train.log || rc=$?
          echo $(( $(date +%s) - s )) > ci-logs/legacy/train.secs
          exit $rc

      - name: Train B (aspect-aware windows + jitter)
        id: aspect
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p ci-logs/aspect
          s=$(date +%s); rc=0
          ./target/release/mirage-train train \
            --weights data/model.safetensors --images data/images \
            --out ci-logs/aspect/pattern.mirp --preview ci-logs/aspect/preview.png \
            --summary-md ci-logs/aspect/summary.md \
            --holdout "$HOLDOUT" --steps "$STEPS" --batch-size "$BATCH_SIZE" \
            2>&1 >ci-logs/aspect/eval.json | tee ci-logs/aspect/train.log || rc=$?
          echo $(( $(date +%s) - s )) > ci-logs/aspect/train.secs
          exit $rc

      - name: Job summary
        if: ${{ always() }}
        run: |
          section() {
            name="$1"; title="$2"; outcome="$3"
            {
              echo
              echo "### ${title}"
              echo
              if [ -f "ci-logs/${name}/train.secs" ]; then echo "- **Training + evaluation time:** $(cat "ci-logs/${name}/train.secs")s"; fi
              if [ -f "ci-logs/${name}/pattern.mirp" ]; then echo "- **Pattern file:** $(stat -c %s "ci-logs/${name}/pattern.mirp") bytes"; fi
              echo
              if [ -f "ci-logs/${name}/summary.md" ]; then cat "ci-logs/${name}/summary.md"; else echo "_No summary was produced (${outcome})._"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" = "failure" ]; then
              {
                echo
                echo "<details open><summary>${title}: last 60 lines of output</summary>"
                echo
                echo '```'
                tail -n 60 "ci-logs/${name}/train.log" 2>/dev/null || true
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          {
            echo "## mirage-train real run"
            echo
            echo "${IMAGES} COCO val2017 photos (first by file name), ${HOLDOUT} held out, ${STEPS} steps, batch ${BATCH_SIZE}. Same data and seed in both runs. Patterns and logs are in the \`mirage-train-run\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          section legacy "A. Legacy window (pattern treated as covering exactly the crop, no jitter)" "${{ steps.legacy.outcome }}"
          section aspect "B. Aspect-aware windows + jitter" "${{ steps.aspect.outcome }}"

      - name: Upload run outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mirage-train-run
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 30
