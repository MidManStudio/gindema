[package]
name = "gindema-cli"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "The gindema CLI, the distributable app that ties the workspace's crates together."
publish = false

[[bin]]
name = "gindema-cli"
path = "src/main.rs"

[dependencies]
gindema-common = { path = "../gindema-common" }
gindema-vm = { path = "../gindema-vm" }
gindema-obfuscate = { path = "../gindema-obfuscate" }
gindema-guard = { path = "../gindema-guard" }
gindema-container = { path = "../gindema-container" }
gindema-ptr = { path = "../gindema-ptr" }
gindema-bits = { path = "../gindema-bits" }

[lints]
workspace = true
