[package]
name = "pixelflip-cli"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "The pixelflip CLI. Applies a pixelflip-core pattern to an image file."
publish = false

[[bin]]
name = "pixelflip-cli"
path = "src/main.rs"

[dependencies]
pixelflip-core = { path = "../pixelflip-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
